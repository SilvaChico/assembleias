<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" data-i18n-content="propostas_apoios_a_discussao_e">
  <title data-i18n="assembleias_versao_local"></title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body class="entry-screen">
  <a class="skip-link" href="#main" data-i18n="saltar_para_o_conteudo"></a>
  <header class="header wrap">
    <img class="brand-symbol" src="/favicon.svg" alt="" width="48" height="48">
    <h1 data-i18n="assembleias"></h1>
    <p id="desk-label" class="eyebrow" data-i18n="mesa" hidden></p>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    <div class="assembly-picker" hidden>
      <label for="assembly-select" data-i18n="assembleia"></label>
      <select id="assembly-select"><option value="lisboa" data-i18n="lisboa"></option><option value="porto" data-i18n="porto"></option></select>
    </div>
    <div id="connection-notice" class="notice error-notice" role="status" hidden></div>
    <div id="access-panel"></div>
    <div id="desk-notice" class="desk-notice" hidden></div>
    <div id="room-management" hidden></div>
    <div id="room-context" class="room-context" hidden></div>
    <div id="workspace" hidden>
      <section id="voting-panel" aria-live="polite"></section>
      <section aria-labelledby="proposals-title" class="proposals-section">
        <div class="section-heading"><h2 id="proposals-title"><span id="proposals-label" data-i18n="propostas"></span> <span id="proposal-count"></span></h2><button class="button primary" type="button" data-action="new" data-i18n="nova_proposta"></button></div>
        <div id="proposals" class="proposal-list"><p data-i18n="a_carregar_as_propostas"></p></div>
        <p class="list-footnote" data-i18n="apoiar_e_pedir_discussao"></p>
      </section>
    </div>
  </main>
  <footer class="footer wrap"><span id="mode-label" data-i18n="modo_de_teste_dados_ficticios"></span><button class="text-button" type="button" data-action="about" data-i18n="privacidade_e_limites"></button></footer>
  <div id="announcement" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <noscript><p class="notice">Ativa o JavaScript para entrar na assembleia.</p></noscript>
</body>
</html>
